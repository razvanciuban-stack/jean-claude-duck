<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #4ade80;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .setup {
      text-align: center;
      width: 100%;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 13px; color: #86efac; margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 10px;
      background: #1a1a2e;
      border: 2px solid #4ade80;
      border-radius: 4px;
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #86efac; }
    button {
      margin-top: 12px;
      padding: 8px 24px;
      background: #4ade80;
      border: none;
      border-radius: 4px;
      color: #0a0a1a;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #86efac; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="setup">
    <h1>Slime Buddy Setup</h1>
    <p>Paste your Anthropic API key to get started</p>
    <input id="key-input" type="password" placeholder="sk-ant-..." autofocus />
    <div class="error" id="error"></div>
    <button id="save-btn" onclick="validate()">Save & Start</button>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const input = document.getElementById('key-input');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('save-btn');

    function validate() {
      const apiKey = input.value.trim();
      if (!apiKey) return;
      btn.disabled = true;
      btn.textContent = 'Validating...';
      errorEl.textContent = '';
      ipcRenderer.send('setup:validate', { apiKey });
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') validate();
    });

    ipcRenderer.on('setup:error', (event, { error }) => {
      errorEl.textContent = error;
      btn.disabled = false;
      btn.textContent = 'Save & Start';
    });
  </script>
</body>
</html>
