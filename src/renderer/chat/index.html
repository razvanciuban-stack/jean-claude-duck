<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Mysthi</title>
  <style>
    /* Mysthi's palette: warm paper, ink black, soft greys */
    :root {
      --paper: #f7f5f1;
      --card: #ffffff;
      --ink: #161514;
      --muted: #8a8680;
      --line: #e2ded6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      background: var(--paper); color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
    }
    header .cat { width: 26px; height: 26px; }
    header h1 { font-size: 15px; font-weight: 600; flex: 1; }
    header .status { font-size: 12px; color: var(--muted); }
    #clear {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    #clear:hover { color: var(--ink); border-color: var(--ink); }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 82%; padding: 9px 12px; border-radius: 14px;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg.error { align-self: center; background: none; color: #a1432f; font-size: 12.5px; text-align: center; }
    .empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 260px; }

    /* Three pulsing dots while she thinks */
    .dots { display: inline-flex; gap: 5px; padding: 4px 0; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); opacity: 0.3; animation: dot 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: 0.2s; }
    .dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    footer { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
    #input {
      flex: 1; resize: none; max-height: 120px; min-height: 38px;
      padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--card); color: var(--ink); font: inherit; outline: none;
    }
    #input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(22, 21, 20, 0.08); }
    #input::placeholder { color: #a7a39b; }
    #send {
      align-self: flex-end; height: 38px; padding: 0 14px; border: none; border-radius: 10px;
      background: var(--ink); color: var(--paper); font: inherit; font-weight: 600; cursor: pointer;
    }
    #send:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <header>
    <svg class="cat" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M18 46 L 22 10 L 44 32 Z M56 32 L 78 10 L 82 46 Z" fill="#161514"/>
      <ellipse cx="50" cy="58" rx="34" ry="30" fill="#161514"/>
      <circle cx="38" cy="56" r="10" fill="#fff"/><circle cx="62" cy="56" r="10" fill="#fff"/>
      <circle cx="40" cy="55" r="4" fill="#161514"/><circle cx="64" cy="55" r="4" fill="#161514"/>
    </svg>
    <h1>Mysthi</h1>
    <span class="status" id="status"></span>
    <button id="clear" title="Forget this conversation">Clear</button>
  </header>
  <main id="messages"></main>
  <footer>
    <textarea id="input" rows="1" placeholder="Talk to Mysthi…" autofocus></textarea>
    <button id="send" disabled>Send</button>
  </footer>
  <script src="chat.js"></script>
</body>
</html>
