<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { overflow: hidden; background: transparent; width: 180px; height: 180px; position: relative; }

    /* Turns Mysthi onto the edge she is walking on: paws to the floor, a wall or the ceiling */
    #stage { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform 0.35s ease; }

    /* A faint light rim so her black silhouette still reads on dark wallpapers */
    #slime-container svg {
      filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.55)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.22));
    }

    /* On the ceiling her paws are at the top of the window: show reactions underneath instead */
    body[data-edge="ceiling"] #reaction-bubble { top: auto; bottom: 2px; }
    body[data-edge="ceiling"] #reaction-bubble::after { bottom: auto; top: -4px; }

    #slime-container {
      width: 120px; height: 120px;
      position: absolute;
      bottom: 0;
      left: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    /* Squish on click */
    .squish {
      transform: scaleX(1.3) scaleY(0.7) !important;
    }

    /* Whole-body moods — a cat breathes, it doesn't bounce */
    #slime-container { transform-origin: 50% 100%; }
    @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.02)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
    @keyframes chatter { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes hop { 0%{transform:translateY(0) scaleY(1)} 20%{transform:scaleY(0.9) scaleX(1.08)} 50%{transform:translateY(-10px) scaleY(1.05) scaleX(0.96)} 100%{transform:translateY(0) scaleY(1)} }
    @keyframes wiggle { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
    @keyframes stretch { 0%,100%{transform:scaleX(1) scaleY(1)} 40%,60%{transform:scaleX(1.12) scaleY(0.9)} }
    @keyframes look-around { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-6deg)} 50%{transform:rotate(0deg)} 75%{transform:rotate(6deg)} }

    /* Arrivals after a stroll */
    @keyframes arrive-bounce { 0%{transform:scaleY(1)} 25%{transform:scaleY(0.9) scaleX(1.06)} 55%{transform:scaleY(1.04) translateY(-4px)} 100%{transform:scaleY(1)} }
    @keyframes arrive-settle { 0%{transform:translateY(-4px)} 40%{transform:translateY(1px) scaleY(0.95)} 100%{transform:translateY(0) scaleY(1)} }
    @keyframes arrive-loaf { 0%,100%{transform:scaleY(1)} 35%,65%{transform:scaleY(0.86) scaleX(1.06)} }

    .anim-bounce, .anim-bob { animation: breathe 3.2s ease-in-out infinite; }
    .anim-float { animation: breathe 4.5s ease-in-out infinite; }
    .anim-shake { animation: shake 0.3s ease-in-out infinite; }
    .anim-bounce-fast { animation: chatter 0.6s ease-in-out infinite; }
    .anim-hop { animation: hop 0.6s ease-in-out; }
    .anim-wiggle { animation: wiggle 0.4s ease-in-out; }
    .anim-jelly, .anim-arrive-spin { animation: stretch 0.9s ease-in-out; }
    .anim-arrive-bounce { animation: arrive-bounce 0.7s ease-out; }
    .anim-arrive-settle { animation: arrive-settle 0.5s ease-out; }
    .anim-arrive-splits { animation: arrive-loaf 1.2s ease-in-out; }
    .anim-look-around { animation: look-around 2s ease-in-out; }

    /* === Mysthi's drawing === */
    /* fill-box only on the sitting pose: the walk pose uses SVG transform attributes with explicit centres */
    #slime-container .pose.sit * { transform-box: fill-box; }
    .pose.walk { visibility: hidden; }
    svg.walking .pose.sit { visibility: hidden; }
    svg.walking .pose.walk { visibility: visible; }
    svg.facing-left .pose.walk { transform: scaleX(-1); transform-box: fill-box; transform-origin: 50% 50%; }

    .tail { transform-origin: 100% 90%; animation: tail-sway 4s ease-in-out infinite; }
    @keyframes tail-sway { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-9deg)} }
    .ear { transform-origin: 50% 100%; transition: transform 0.3s cubic-bezier(.3,1.8,.5,1); }
    .whiskers.left { transform-origin: 100% 50%; }
    .whiskers.right { transform-origin: 0% 50%; }
    .eye, .lid { transform-origin: 50% 50%; transition: transform 0.15s ease; }
    .pupil { transition: transform 0.25s ease; }

    svg[data-eyes="half"] .lid { transform: scaleY(0.55); }
    svg[data-eyes="wide"] .eye { transform: scale(1.14); }
    svg[data-eyes="wide"] .ear { transform: scaleY(1.06); }
    svg[data-eyes="closed"] .lid, svg[data-eyes="squish"] .lid, svg[data-eyes="hearts"] .lid, svg[data-eyes="stars"] .lid { opacity: 0; }
    svg.blinking .lid { transform: scaleY(0.08); transition-duration: 0.07s; }

    svg.ear-twitch .ear.left { animation: ear-twitch 0.25s ease-in-out 2; }
    @keyframes ear-twitch { 50%{transform:rotate(-12deg)} }
    svg.tail-flick .tail { animation: tail-flick 0.45s ease-in-out 2; }
    @keyframes tail-flick { 50%{transform:rotate(-24deg)} }
    svg.whisker-twitch .whiskers.left { animation: whisker-l 0.3s ease-in-out 2; }
    svg.whisker-twitch .whiskers.right { animation: whisker-r 0.3s ease-in-out 2; }
    @keyframes whisker-l { 50%{transform:rotate(-7deg)} }
    @keyframes whisker-r { 50%{transform:rotate(7deg)} }

    /* Particles */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      animation: particle-fly 1s ease-out forwards;
    }
    @keyframes particle-fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
    }

    /* === Reaction Bubble === */
    #reaction-bubble {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 160px;
      padding: 5px 10px;
      background: #f7f5f1;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      color: #161514;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11.5px;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      transition: none;
    }
    #reaction-bubble::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #f7f5f1;
      border-bottom-right-radius: 2px;
      transform: translateX(-50%) rotate(45deg);
    }
    @keyframes reaction-in {
      0%   { opacity: 0; transform: translateX(-50%) translateY(6px) scale(0.8); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    @keyframes reaction-out {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(0.8); }
    }
    #reaction-bubble.show {
      animation: reaction-in 0.3s ease-out forwards;
    }
    #reaction-bubble.hide {
      animation: reaction-out 0.4s ease-in forwards;
    }
  </style>
</head>
<body>
  <div id="reaction-bubble"></div>
  <div id="stage"><div id="slime-container"></div></div>
  <script src="mysthi.js"></script>
  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('slime-container');
    const svg = createMysthiSVG();
    container.appendChild(svg);

    // Current state
    let currentEyeType = 'open';
    let cursorDx = 0, cursorDy = 0;
    let clickCount = 0;

    // Initial state
    setEyesWithDirection(svg, 'open', 0, 0);
    setMouth(svg, 'grin');
    setAnimation(container, 'bounce');

    // Temporary eye effects (squish, hearts, stars, wide) — skipped while closed (learning on, not watching)
    function flashEyes(type) {
      if (currentEyeType === 'closed') return;
      setEyesWithDirection(svg, type, 0, 0);
    }

    // --- Cursor direction tracking (sent from main process) ---
    ipcRenderer.on('cursor:direction', (event, { dx, dy, dist }) => {
      cursorDx = dx;
      cursorDy = dy;
      // Follow the cursor, unless a short eye effect (squish, hearts, slow blink…) is showing
      if (svg.dataset.eyes === currentEyeType) {
        setEyesWithDirection(svg, currentEyeType, dx, dy);
      }
    });

    ipcRenderer.on('cursor:near', () => {
      // Cursor is close — look straight ahead
      if (svg.dataset.eyes === currentEyeType) {
        setEyesWithDirection(svg, currentEyeType, 0, 0);
      }
    });

    // --- Spawn particles ---
    function spawnParticles(emoji, count = 3) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emoji;
        p.style.left = (40 + Math.random() * 40) + 'px';
        p.style.top = (10 + Math.random() * 30) + 'px';
        p.style.setProperty('--tx', (Math.random() * 60 - 30) + 'px');
        p.style.setProperty('--ty', (-30 - Math.random() * 40) + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    // Listen for state updates from main
    ipcRenderer.on('pet:state', (event, { state, eyes, mouth, animation }) => {
      currentEyeType = eyes;
      setEyesWithDirection(svg, eyes, cursorDx, cursorDy);
      setMouth(svg, mouth);
      if (!isWandering) setAnimation(container, animation);
      // 'blink' eyes are open eyes; mysthi.js blinks them naturally

      // Handle talking mouth animation
      if (mouth === 'talking') {
        let mouthOpen = true;
        const talkInterval = setInterval(() => {
          mouthOpen = !mouthOpen;
          setMouth(svg, mouthOpen ? 'talking' : 'grin');
        }, 300);
        ipcRenderer.once('pet:state', () => clearInterval(talkInterval));
      }
    });

    // --- Hit testing (per-pixel: only opaque SVG elements) ---
    document.addEventListener('mousemove', (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const hit = el && el !== svg && svg.contains(el);
      ipcRenderer.send('slime:hit-test', { hit: !!hit });
    });

    // --- Right-click: app menu (learning on/off, pause, show/hide, quit) ---
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('pet:context-menu');
    });

    // --- Drag + Click handling ---
    let dragState = null;

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // right-click opens the menu instead of starting a drag
      // Squish on press!
      squish(container);
      flashEyes('squish');

      dragState = {
        startX: e.screenX,
        startY: e.screenY,
        startTime: Date.now(),
        dragging: false,
      };
      ipcRenderer.send('slime:drag-start', { screenX: e.screenX, screenY: e.screenY });
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragState) return;
      const dx = e.screenX - dragState.startX;
      const dy = e.screenY - dragState.startY;
      if (!dragState.dragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
        dragState.dragging = true;
      }
      if (dragState.dragging) {
        ipcRenderer.send('slime:drag-move', { deltaX: dx, deltaY: dy });
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragState) return;
      const elapsed = Date.now() - dragState.startTime;
      const dx = Math.abs(e.screenX - dragState.startX);
      const dy = Math.abs(e.screenY - dragState.startY);

      // Restore eyes after squish
      setTimeout(() => {
        setEyesWithDirection(svg, currentEyeType, cursorDx, cursorDy);
      }, 200);

      if (elapsed < 200 && dx < 5 && dy < 5 && e.altKey) {
        // ⌥-click: toggle learning pause instead of opening chat
        ipcRenderer.send('learning:toggle-pause');
      } else if (elapsed < 200 && dx < 5 && dy < 5) {
        // It's a click!
        clickCount++;
        ipcRenderer.send('slime:interaction', {});

        // Fun reactions based on click count
        if (clickCount % 5 === 0) {
          // Every 5 clicks — hearts!
          flashEyes('hearts');
          setMouth(svg, 'big-smile');
          spawnParticles('💜', 5);
          setTimeout(() => {
            setEyesWithDirection(svg, currentEyeType, cursorDx, cursorDy);
            setMouth(svg, 'grin');
          }, 1500);
        } else if (clickCount % 3 === 0) {
          // Every 3 clicks — stars!
          flashEyes('stars');
          spawnParticles('✨', 4);
          setTimeout(() => {
            setEyesWithDirection(svg, currentEyeType, cursorDx, cursorDy);
          }, 1000);
        } else {
          // Normal click — ears perk up
          playFlourish(svg, 'ear-twitch', 600);
          spawnParticles('🐾', 1);
        }
      }
      ipcRenderer.send('slime:drag-end', {});
      dragState = null;
    });

    // --- Wandering: side-on walk while the window strolls, sit down on arrival ---
    let isWandering = false;

    // Off the floor she clings in her side-on pose; a cat can't sit on a wall
    const onFloor = () => (document.body.dataset.edge || 'floor') === 'floor';
    function rest() {
      isWandering = false;
      setPose(svg, onFloor() ? 'sit' : 'cling');
    }

    function sitDown(anim, ms) {
      rest();
      if (!onFloor()) return;
      container.className = '';
      container.classList.add(`anim-${anim}`);
      setTimeout(() => { container.className = ''; setAnimation(container, 'bounce'); }, ms);
    }

    // --- Which edge she is on: rotate the stage so her paws touch it ---
    const stage = document.getElementById('stage');
    const EDGE_ANGLE = { floor: 0, right: -90, ceiling: 180, left: 90 };
    function setEdge(edge) {
      if (!(edge in EDGE_ANGLE)) return;
      document.body.dataset.edge = edge;
      stage.style.transform = `rotate(${EDGE_ANGLE[edge]}deg)`;
      if (!isWandering) rest(); // e.g. dropped onto a wall after a drag
    }
    ipcRenderer.on('pet:edge', (event, { edge }) => setEdge(edge));

    ipcRenderer.on('pet:wander', (event, { action, direction, edge }) => {
      if (edge) setEdge(edge);
      if (action === 'walk') {
        isWandering = true;
        container.className = '';
        setPose(svg, 'walk', direction === 'left' ? 'left' : 'right');
      } else if (action === 'stop') {
        rest();
        container.className = '';
        setAnimation(container, 'bounce');
      } else if (action === 'arrive-bounce') {
        sitDown('arrive-bounce', 700);
        spawnParticles('🐾', 2);
      } else if (action === 'arrive-spin') {
        sitDown('arrive-spin', 900); // a big stretch
        playFlourish(svg, 'tail-flick');
      } else if (action === 'arrive-settle') {
        sitDown('arrive-settle', 500);
        playFlourish(svg, 'whisker-twitch', 700);
      } else if (action === 'arrive-splits') {
        sitDown('arrive-splits', 1200); // settles into a loaf for a moment
        flashEyes('squish');
        setTimeout(() => setEyesWithDirection(svg, currentEyeType, cursorDx, cursorDy), 1200);
      }
    });

    // === Reaction Bubble System ===
    const reactionBubble = document.getElementById('reaction-bubble');
    let reactionQueue = [];
    let reactionShowing = false;

    function showNextReaction() {
      if (reactionShowing || reactionQueue.length === 0) return;
      reactionShowing = true;

      const text = reactionQueue.shift();
      reactionBubble.textContent = text;
      reactionBubble.className = 'show';

      // Hold for 4 seconds, then fade out
      setTimeout(() => {
        reactionBubble.className = 'hide';
        setTimeout(() => {
          reactionBubble.className = '';
          reactionBubble.style.opacity = '0';
          reactionShowing = false;
          // Show next queued reaction if any
          showNextReaction();
        }, 400);
      }, 4000);
    }

    ipcRenderer.on('pet:reaction', (event, { text }) => {
      // Only queue if not already queued (max 2 in queue)
      if (reactionQueue.length < 2) {
        reactionQueue.push(text);
      }
      showNextReaction();
    });

    // --- Random idle behaviours ---
    setInterval(() => {
      if (isWandering) return; // don't interrupt walking
      if (Math.random() < 0.15) {
        const behaviours = ['ear-twitch', 'tail-flick', 'whisker-twitch', 'look-around', 'stretch', 'slow-blink'];
        const pick = behaviours[Math.floor(Math.random() * behaviours.length)];
        if (pick === 'look-around') {
          container.style.animation = 'look-around 2s ease-in-out';
          setTimeout(() => { container.style.animation = ''; }, 2000);
        } else if (pick === 'stretch') {
          container.style.animation = 'stretch 0.9s ease-in-out';
          setTimeout(() => { container.style.animation = ''; }, 900);
        } else if (pick === 'slow-blink') {
          // A cat's slow blink: "I trust you"
          if (currentEyeType !== 'closed') {
            setEyes(svg, 'half');
            setTimeout(() => setEyesWithDirection(svg, currentEyeType, cursorDx, cursorDy), 1200);
          }
        } else {
          playFlourish(svg, pick);
        }
      }
    }, 8000);
  </script>
</body>
</html>
