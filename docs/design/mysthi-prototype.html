<!doctype html>
<html><head><meta charset="utf-8"><title>Mysthi spike</title>
<style>
  html,body{margin:0;height:100%;background:#f4f2ee;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
  #bar button{border:1px solid #222;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  #bar button.on{background:#111;color:#fff}
  #hint{position:fixed;bottom:12px;left:12px;font-size:12px;color:#777}
  #cat{position:absolute;width:180px;height:216px;left:calc(50% - 90px);top:calc(55% - 108px)}
  #cat svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:opacity .15s}
  #sit *{transform-box:fill-box}
  #walk{opacity:0}
  #cat.moving #walk{opacity:1}
  #cat.moving #sit{opacity:0}

  /* breathing */
  #body{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scaleY(1.018)}}

  /* tail */
  #tail{transform-origin:100% 90%;animation:tail 4s ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}

  #head{transform-origin:50% 90%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .ear{transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
  .eye{transform-origin:50% 50%;transition:transform .25s ease}
  .lid{transform-origin:50% 50%}
  .blink .lid{animation:blink .18s ease-in-out}
  @keyframes blink{50%{transform:scaleY(.06)}}
  .pupil{transition:r .3s}
  .whiskers{transform-origin:100% 50%}
  .whiskers.r{transform-origin:0% 50%}
  .twitch .whiskers{animation:twitch .35s ease-in-out 2}
  @keyframes twitch{50%{transform:rotate(-6deg)}}
  .twitch .whiskers.r{animation-name:twitchR}
  @keyframes twitchR{50%{transform:rotate(6deg)}}

  /* curious */
  .curious #head{transform:translateY(-4px) rotate(-6deg)}
  .curious .ear{transform:scaleY(1.15)}
  .curious .eye{transform:scale(1.14)}

  /* thinking */
  .thinking #tail{animation-duration:1.1s}
  .thinking .lid{transform:scaleY(.62)}
  .thinking #head{transform:rotate(5deg)}
  #dots{opacity:0;transition:opacity .3s}
  .thinking #dots{opacity:1}
  #dots circle{animation:dot 1.2s infinite}
  #dots circle:nth-child(2){animation-delay:.2s}
  #dots circle:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

  /* sleeping */
  #all{transition:transform .5s ease}
  .sleeping #body{animation:breathe 4.5s ease-in-out infinite}
  .sleeping #all{transform:translateY(22px) scaleY(.9);transform-origin:50% 100%}
  .sleeping .lid{transform:scaleY(.06)}
  .sleeping .pupil{opacity:0}
  .sleeping #tail{animation:none}
  .sleeping #head{transform:translateY(10px) rotate(-8deg)}
  .sleeping .ear{transform:rotate(-14deg) scaleY(.85)}
  #zzz{opacity:0}
  .sleeping #zzz{opacity:1}
  #zzz text{font:700 16px system-ui;fill:#111;animation:z 2.6s linear infinite;opacity:0}
  #zzz text:nth-child(2){animation-delay:.9s}
  #zzz text:nth-child(3){animation-delay:1.8s}
  @keyframes z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-40px)}}
</style></head><body>
<div id="bar">
  <button data-s="idle" class="on">Idle</button>
  <button data-s="curious">Curious</button>
  <button data-s="thinking">Thinking</button>
  <button data-s="walking">Follow cursor</button>
  <button data-s="sleeping">Sleeping</button>
</div>
<div id="hint">Move your mouse — her eyes follow. "Follow cursor" makes her walk after it. Click her to make her curious.</div>

<div id="cat" class="idle">
<!-- SITTING (front view) -->
<svg id="sit" viewBox="0 0 200 240">
 <g id="all">
  <g id="tail">
    <path d="M66 226 C 26 228, 14 200, 24 176 C 30 160, 22 150, 14 156" fill="none" stroke="#111" stroke-width="13" stroke-linecap="round"/>
  </g>
  <g id="body">
    <!-- torso + haunches -->
    <path d="M74 104 C 66 136, 56 176, 52 210 C 50 224, 58 230, 70 230 L 130 230 C 142 230, 150 224, 148 210 C 144 176, 134 136, 126 104 Z" fill="#111"/>
    <!-- haunch lines -->
    <path d="M62 222 C 64 200, 72 186, 84 180" fill="none" stroke="#f4f2ee" stroke-width="2" stroke-linecap="round"/>
    <path d="M138 222 C 136 200, 128 186, 116 180" fill="none" stroke="#f4f2ee" stroke-width="2" stroke-linecap="round"/>
    <!-- front legs: two slim columns with a gap and round paws -->
    <path d="M85 150 C 84 175, 84 205, 83 222 Q 83 231 91 231 Q 99 231 98 222 C 98 205, 99 175, 99 150 Z" fill="#111" stroke="#f4f2ee" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M101 150 C 101 175, 102 205, 102 222 Q 101 231 109 231 Q 117 231 117 222 C 116 205, 116 175, 115 150 Z" fill="#111" stroke="#f4f2ee" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- chest covers the top of the legs -->
    <ellipse cx="100" cy="146" rx="22" ry="16" fill="#111"/>
    <!-- toe hints -->
    <path d="M88 228 L 88 231 M93 228 L 93 231 M106 228 L 106 231 M111 228 L 111 231" stroke="#f4f2ee" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g id="head">
    <g class="ear"><path d="M58 70 L 64 22 L 94 50 Z" fill="#111" stroke="#111" stroke-width="8" stroke-linejoin="round"/></g>
    <g class="ear"><path d="M106 50 L 136 22 L 142 70 Z" fill="#111" stroke="#111" stroke-width="8" stroke-linejoin="round"/></g>
    <ellipse cx="100" cy="80" rx="50" ry="40" fill="#111"/>
    <g class="whiskers"><path d="M62 92 L 26 84 M62 97 L 24 99 M63 102 L 30 112" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></g>
    <g class="whiskers r"><path d="M138 92 L 174 84 M138 97 L 176 99 M137 102 L 170 112" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></g>
    <g class="eye"><g class="lid">
      <circle cx="80" cy="76" r="17" fill="#fff"/>
      <circle class="pupil" cx="80" cy="76" r="6.5" fill="#111"/>
    </g></g>
    <g class="eye"><g class="lid">
      <circle cx="120" cy="76" r="17" fill="#fff"/>
      <circle class="pupil" cx="120" cy="76" r="6.5" fill="#111"/>
    </g></g>
  </g>
  <g id="dots"><circle cx="150" cy="30" r="4" fill="#111"/><circle cx="163" cy="22" r="4" fill="#111"/><circle cx="176" cy="14" r="4" fill="#111"/></g>
  <g id="zzz"><text x="140" y="50">z</text><text x="140" y="50">z</text><text x="140" y="50">Z</text></g>
 </g>
</svg>

<!-- WALKING (side view, faces right; flipped with scaleX for left) -->
<svg id="walk" viewBox="0 0 200 240">
 <g id="wflip" style="transform-origin:100px 120px">
  <g id="farLegs"></g>
  <g id="wbody">
    <path id="wtail" d="M50 140 C 26 132, 18 104, 28 82 C 33 72, 42 70, 44 78" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
    <path d="M48 152 C 40 128, 66 118, 100 120 C 126 121, 142 116, 154 124 C 166 134, 162 160, 142 164 L 72 166 C 58 166, 50 160, 48 152 Z" fill="#111"/>
    <g id="whead">
      <path d="M140 92 L 142 56 L 162 76 Z M166 74 L 184 54 L 188 90 Z" fill="#111" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
      <ellipse cx="164" cy="104" rx="30" ry="26" fill="#111"/>
      <path d="M180 112 L 206 106 M180 116 L 208 118" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="160" cy="100" r="10.5" fill="#fff"/><circle cx="181" cy="99" r="9" fill="#fff"/>
      <circle cx="164" cy="100" r="4.2" fill="#111"/><circle cx="184.5" cy="99" r="3.8" fill="#111"/>
    </g>
  </g>
  <g id="nearLegs"></g>
 </g>
</svg>
</div>

<script>
const cat = document.getElementById('cat');
const sit = document.getElementById('sit');
const pupils = [...sit.querySelectorAll('.pupil')];
const base = pupils.map(p => ({ x: +p.getAttribute('cx'), y: +p.getAttribute('cy') }));
let state = 'idle', mouse = { x: innerWidth / 2, y: innerHeight / 2 };
let pos = { x: cat.offsetLeft, y: cat.offsetTop }, facing = 1, speed = 0, phase = 0;

function setState(s) {
  state = s;
  cat.classList.remove('idle', 'curious', 'thinking', 'walking', 'sleeping');
  cat.classList.add(s);
  if (s !== 'walking') { cat.classList.remove('moving'); speed = 0; }
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
document.getElementById('bar').onclick = e => { if (e.target.dataset.s) setState(e.target.dataset.s); };
cat.onclick = () => { if (state !== 'walking') { setState('curious'); setTimeout(() => state === 'curious' && setState('idle'), 2500); } };
addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });

function lookAt() {
  const pt = sit.createSVGPoint();
  const inv = sit.getScreenCTM().inverse();
  pupils.forEach((p, i) => {
    let tx, ty;
    if (state === 'thinking') { tx = base[i].x + 4; ty = base[i].y - 7; }
    else {
      pt.x = mouse.x; pt.y = mouse.y;
      const m = pt.matrixTransform(inv);
      const dx = m.x - base[i].x, dy = m.y - base[i].y;
      const d = Math.hypot(dx, dy) || 1, max = state === 'curious' ? 5 : 8;
      const k = Math.min(max, d / 12) / d;
      tx = base[i].x + dx * k; ty = base[i].y + dy * k;
    }
    const cx = +p.getAttribute('cx'), cy = +p.getAttribute('cy');
    p.setAttribute('cx', cx + (tx - cx) * .25);
    p.setAttribute('cy', cy + (ty - cy) * .25);
    p.setAttribute('r', state === 'curious' ? 4.5 : 6.5);
  });
}

// ---- side-view walk cycle: 4 two-segment legs solved with simple IK ----
const NS = 'http://www.w3.org/2000/svg';
const GROUND = 229, UPPER = 31, LOWER = 31, STRIDE = 30, LIFT = 10, STANCE = 0.6, DROP = 18;
// cat "lateral sequence" walk: back-left, front-left, back-right, front-right, a quarter cycle apart
const legs = [
  { hip: 66,  hipY: 168, off: 0.0,  near: true,  front: false },
  { hip: 138, hipY: 166, off: 0.25, near: true,  front: true },
  { hip: 74,  hipY: 168, off: 0.5,  near: false, front: false },
  { hip: 146, hipY: 166, off: 0.75, near: false, front: true },
].map(l => {
  const g = document.createElementNS(NS, 'g');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#111');
  path.setAttribute('stroke-width', l.front ? 9 : 11);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  const paw = document.createElementNS(NS, 'ellipse');
  paw.setAttribute('rx', 6.5); paw.setAttribute('ry', 4); paw.setAttribute('fill', '#111');
  g.append(path, paw);
  // far legs sit behind the body and get a hairline outline so they read as separate limbs
  if (!l.near) { path.setAttribute('stroke', '#2a2a2a'); paw.setAttribute('fill', '#2a2a2a'); }
  document.getElementById(l.near ? 'nearLegs' : 'farLegs').appendChild(g);
  return { ...l, path, paw };
});

const ease = s => s * s * (3 - 2 * s);
function footAt(l, t) {
  if (t < STANCE) return { x: l.hip + STRIDE / 2 - STRIDE * (t / STANCE), y: GROUND };
  const s = (t - STANCE) / (1 - STANCE);
  return { x: l.hip - STRIDE / 2 + STRIDE * ease(s), y: GROUND - Math.sin(Math.PI * s) * LIFT };
}
function solveKnee(hx, hy, fx, fy) {
  let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy);
  d = Math.min(d, UPPER + LOWER - 0.5);
  const a = (UPPER * UPPER - LOWER * LOWER + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, UPPER * UPPER - a * a));
  const ux = dx / d, uy = dy / d;
  // joint bends backward (elbow on front legs, hock on back legs)
  return { x: hx + ux * a + uy * h, y: hy + uy * a - ux * h };
}
function drawLegs(bob) {
  for (const l of legs) {
    const t = ((phase + l.off) % 1 + 1) % 1;
    const f = footAt(l, t), hy = l.hipY + bob;
    const k = solveKnee(l.hip, hy, f.x, f.y - 3);
    l.path.setAttribute('d', `M${l.hip} ${hy} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${f.x.toFixed(1)} ${(f.y - 3).toFixed(1)}`);
    l.paw.setAttribute('cx', (f.x + 3).toFixed(1));
    l.paw.setAttribute('cy', (f.y - 2).toFixed(1));
  }
}
const wbody = document.getElementById('wbody'), whead = document.getElementById('whead');
const wtail = document.getElementById('wtail'), wflip = document.getElementById('wflip');

let last = performance.now();
function walk(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  if (state !== 'walking') return;
  const targetX = mouse.x - 90, targetY = mouse.y - 236;
  const dx = targetX - pos.x, dy = targetY - pos.y, d = Math.hypot(dx, dy);
  const want = d > 70 ? 95 : 0;                      // px/s, a calm cat stroll
  speed += (want - speed) * Math.min(1, dt * (want ? 4 : 7));
  if (speed > 4) {
    if (Math.abs(dx) > 20) facing = dx < 0 ? -1 : 1;
    const step = speed * dt;
    pos.x += dx / d * step; pos.y += dy / d * step;
    phase += step / (STRIDE * 0.9);                   // feet stay planted: body travels one stride per cycle
    cat.classList.add('moving');
  } else if (speed < 2) {
    cat.classList.remove('moving');
  }
  const bob = Math.sin(phase * Math.PI * 4) * 1.6;
  wbody.setAttribute('transform', `translate(0 ${(DROP + bob).toFixed(2)})`);
  whead.setAttribute('transform', `translate(0 ${(Math.sin(phase * Math.PI * 4 - 0.6) * 1.2).toFixed(2)})`);
  wtail.setAttribute('transform', `rotate(${(Math.sin(phase * Math.PI * 2) * 6).toFixed(2)} 50 140)`);
  wflip.style.transform = `scaleX(${facing})`;
  drawLegs(bob);
  cat.style.left = pos.x + 'px'; cat.style.top = pos.y + 'px';
}

function loop(now) { lookAt(); walk(now); requestAnimationFrame(loop); }
drawLegs(0);
requestAnimationFrame(loop);

(function blink() {
  if (state !== 'sleeping') { cat.classList.add('blink'); setTimeout(() => cat.classList.remove('blink'), 200); }
  setTimeout(blink, 2500 + Math.random() * 3500);
})();
(function twitch() {
  if (state !== 'sleeping') { cat.classList.add('twitch'); setTimeout(() => cat.classList.remove('twitch'), 800); }
  setTimeout(twitch, 5000 + Math.random() * 6000);
})();
</script>
</body></html>
